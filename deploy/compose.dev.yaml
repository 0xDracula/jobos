services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobbos
      POSTGRES_PASSWORD: jobbos
      POSTGRES_DB: jobbos
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbos -d jobbos"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db: {}
