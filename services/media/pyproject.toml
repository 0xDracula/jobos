[project]
name = "jobbos-media"
version = "0.1.0"
description = "Jobbos media service: search, matching, downloads and audio processing"
requires-python = ">=3.12"
dependencies = [
  "anyascii>=0.3.2",
  "essentia==2.1b6.dev1389",
  "fastapi>=0.115",
  "fonttools[woff]>=4.55",
  "httpx>=0.27",
  "numpy>=2",
  "onnxruntime>=1.20",
  "pillow>=11",
  "rapidfuzz>=3.9",
  "uvicorn>=0.30",
  "yt-dlp>=2025.1.1",
  "ytmusicapi>=1.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
