<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobbos Dev Player</title>
<style>
  :root {
    --bg: #FFF7F0; --surface: #FFFFFF; --ink: #3B2F3F; --muted: #7A6A7E;
    --accent: #E88FA3; --accent-strong: #A8445E; --soft: #F7C6D0; --on-accent: #FFFFFF;
    --line: rgba(59, 47, 63, 0.14);
    --ok-bg: #D6F0DC; --ok-ink: #1F5A2E; --warn-bg: #FBE7B5; --warn-ink: #6B4A00; --bad-bg: #F9D0CC; --bad-ink: #7A1F16;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E1B3A; --surface: #262249; --ink: #F5EEF8; --muted: #B9AEC6;
      --accent: #F2A7B8; --accent-strong: #F2A7B8; --soft: #3A3160; --on-accent: #1E1B3A;
      --line: rgba(245, 238, 248, 0.14);
      --ok-bg: #234A31; --ok-ink: #C8F0D2; --warn-bg: #4F4019; --warn-ink: #FBE7B5; --bad-bg: #5A2A2A; --bad-ink: #F9D0CC;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  a { color: inherit; }
  .card { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06); min-width: 0; }
  form { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  input[type=search], input[type=url], input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  input[type=file] { font: inherit; max-width: 100%; }
  .field { display: grid; gap: 4px; flex: 1 1 240px; min-width: 0; font-size: 13px; color: var(--muted); }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 16px; background: var(--accent-strong); color: var(--on-accent); cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row:last-child, .prow:last-child { border-bottom: 0; }
  .row img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--soft); }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .title { font-weight: 700; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  a.sub { display: block; width: fit-content; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .chip.bad { background: var(--bad-bg); color: var(--bad-ink); }
  .prow .chips, #pl-counts .chips { justify-content: flex-start; margin: 4px 0 6px; }
  .field.submit { flex: 0 0 auto; align-self: flex-end; }
  .bar { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent-strong); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
  .tabs button { background: var(--soft); color: var(--ink); padding: 4px 12px; font-size: 13px; }
  .tabs button[aria-pressed=true] { background: var(--accent-strong); color: var(--on-accent); }
  .head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 12px; }
  .phead { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
  .phead .head { margin-bottom: 8px; }
  .art { width: 96px; height: 96px; flex: none; border-radius: 12px; object-fit: cover; background: var(--soft); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15); }
  .swatches { display: flex; gap: 6px; }
  .swatches span { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); }
  #player { transition: background 0.4s; }
  @media (prefers-reduced-motion: reduce) { #player { transition: none; } }
  canvas { width: 100%; height: 64px; display: block; cursor: pointer; margin-bottom: 8px; }
  audio { width: 100%; }
  .meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .empty { color: var(--muted); padding: 8px 0; }
  .lyrics { position: relative; max-height: 280px; overflow-y: auto; margin-top: 12px; padding: 8px 4px 0; border-top: 1px solid var(--line); }
  .lyrics .line { padding: 3px 0; color: var(--muted); cursor: pointer; font-size: 17px; line-height: 1.5; transition: color 0.2s; }
  .lyrics .line.now { color: var(--ink); font-weight: 700; }
  .lyrics .plain { white-space: pre-wrap; }
  .lyrics > .sub { padding: 8px 0; }
  @media (prefers-reduced-motion: reduce) { .lyrics .line { transition: none; } }
  @media (max-width: 560px) {
    .row { grid-template-columns: 48px minmax(0, 1fr) auto; }
    .row .dur { display: none; }
    .row .chips { grid-column: 2; grid-row: 2; justify-content: flex-start; }
    .row button { grid-column: 3; grid-row: 1 / span 2; }
  }
</style>
</head>
<body>
<main>
  <h1>Jobbos dev player</h1>

  <section class="card" aria-labelledby="search-h">
    <h2 id="search-h">Search</h2>
    <form id="search-form">
      <input id="q" type="search" aria-label="Search" value="Ghir Enta Souad Massi" required>
      <button type="submit">Search</button>
    </form>
    <div id="results"></div>
  </section>

  <section class="card" id="player" hidden aria-labelledby="p-title">
    <div class="phead">
      <img class="art" id="p-art" alt="" hidden>
      <div>
        <div class="head">
          <span class="title" id="p-title" dir="auto"></span>
          <span class="sub" id="p-artist" dir="auto"></span>
          <span class="chip" id="p-status"></span>
        </div>
        <div class="swatches" id="p-palette" aria-hidden="true"></div>
      </div>
    </div>
    <canvas id="wave" width="1600" height="128" aria-label="Waveform"></canvas>
    <audio id="audio" controls preload="metadata"></audio>
    <div class="meta">
      <span id="p-loud"></span><span id="p-gain"></span><span id="p-dur"></span><span id="p-err"></span>
    </div>
    <div class="lyrics" id="lyrics" aria-label="Lyrics"></div>
  </section>

  <section class="card" aria-labelledby="import-h">
    <h2 id="import-h">Import</h2>
    <form id="import-form">
      <label class="field">Spotify playlist link
        <input id="import-url" type="url" required placeholder="https://open.spotify.com/playlist/…">
      </label>
      <label class="field">Name
        <input id="import-name" type="text" required maxlength="200" dir="auto">
      </label>
      <label class="field">Exportify CSV
        <input id="import-file" type="file" accept=".csv,text/csv" required>
      </label>
      <div class="field submit"><button type="submit">Import</button></div>
    </form>
    <div class="sub" id="import-result" role="status"></div>
  </section>

  <section class="card" aria-labelledby="playlists-h">
    <h2 id="playlists-h">Playlists</h2>
    <div id="playlists"></div>
  </section>

  <section class="card" id="playlist" hidden aria-labelledby="pl-title">
    <h2 id="pl-title" dir="auto"></h2>
    <div id="pl-counts"></div>
    <div class="tabs" role="group" aria-label="Filter">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="review" aria-pressed="false">Review</button>
      <button type="button" data-filter="unmatched" aria-pressed="false">Unmatched</button>
      <button type="button" data-filter="pending" aria-pressed="false">Pending</button>
    </div>
    <div id="pl-tracks"></div>
  </section>

  <section class="card" aria-labelledby="recent-h">
    <h2 id="recent-h">Recent tracks</h2>
    <div id="recent"></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (ms) => {
    if (!ms) return "";
    const s = Math.round(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  let current = null;
  let peaks = [];
  let pollTimer = null;
  let openPlaylistId = null;
  let playlistFilter = "all";
  let playlistTimer = null;
  let lastPlaylist = null;
  let lyricLines = [];
  let lyricOffset = 0;
  let lyricIndex = -1;
  let lyricsTimer = null;
  const LYRICS_SOURCE = { lrclib: "LRCLIB", ytmusic: "YouTube Music", manual: "Manual" };

  async function api(path, opts) {
    const r = await fetch(path, opts);
    const body = r.status === 204 ? null : await r.json();
    if (!r.ok && r.status !== 202) throw new Error((body && body.error) || r.statusText);
    return body;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function chip(text, kind) {
    return el("span", kind ? "chip " + kind : "chip", text);
  }

  const MATCH_KIND = { matched: "ok", chosen: "ok", review: "warn", unmatched: "bad", pending: "" };

  function matchChip(t) {
    if (!t.match_status) return null;
    const score = t.match_status === "review" && t.source && t.source.score != null ? " " + t.source.score.toFixed(2) : "";
    return chip(t.match_status + score, MATCH_KIND[t.match_status]);
  }

  function cacheChip(t) {
    return chip(t.status, t.status === "cached" ? "ok" : t.status === "failed" ? "bad" : "");
  }

  function sourceLink(source) {
    const host = source.provider === "ytmusic" ? "https://music.youtube.com" : "https://www.youtube.com";
    const parts = [source.title, source.uploader, fmt(source.duration_ms)].filter(Boolean);
    const a = el("a", "sub", "Source: " + parts.join(" · "));
    a.href = host + "/watch?v=" + encodeURIComponent(source.external_id);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.dir = "auto";
    return a;
  }

  function row({ artwork, title, subtitle, detail, duration, chips = [], action, onAction }) {
    const r = el("div", "row");
    const img = el("img");
    img.alt = "";
    img.loading = "lazy";
    if (artwork) img.src = artwork;
    const info = el("div");
    const t = el("div", "title", title); t.dir = "auto";
    const s = el("div", "sub", subtitle); s.dir = "auto";
    info.append(t, s);
    if (detail) info.append(detail);
    const c = el("div", "chips");
    c.append(...chips.filter(Boolean));
    const b = el("button", "", action);
    b.type = "button";
    b.addEventListener("click", onAction);
    r.append(img, info, el("span", "sub dur", fmt(duration)), c, b);
    return r;
  }

  $("search-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const list = $("results");
    list.replaceChildren(el("div", "empty", "Searching"));
    try {
      const { results } = await api("/api/search?q=" + encodeURIComponent($("q").value) + "&limit=10");
      if (!results.length) return list.replaceChildren(el("div", "empty", "No results"));
      list.replaceChildren(...results.map((r) => row({
        artwork: r.thumbnail,
        title: r.title,
        subtitle: r.artists.map((a) => a.name).join(", ") + (r.album ? " · " + r.album.name : ""),
        duration: r.duration_ms,
        action: "Play",
        onAction: () => addAndPlay(r),
      })));
    } catch (err) {
      list.replaceChildren(el("div", "empty", "Search failed: " + err.message));
    }
  });

  async function addAndPlay(result) {
    try {
      show(await api("/api/tracks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(result),
      }));
      loadRecent();
    } catch (err) {
      $("player").hidden = false;
      $("p-err").textContent = "Error: " + err.message;
    }
  }

  async function play(id) {
    try {
      show(await api("/api/tracks/" + id + "/cache", { method: "POST" }));
    } catch (err) {
      $("player").hidden = false;
      $("p-err").textContent = "Error: " + err.message;
    }
  }

  function show(view) {
    current = view.id;
    $("player").hidden = false;
    $("p-title").textContent = view.title;
    $("p-artist").textContent = view.artists.join(", ");
    showArtwork(view);
    clearTimeout(pollTimer);
    render(view);
    if (view.status !== "cached" && view.status !== "failed") poll(view.id);
    loadLyrics(view.id);
  }

  function showArtwork(view) {
    const art = $("p-art");
    art.hidden = !view.artwork_url;
    if (view.artwork_url) art.src = view.artwork_url;
    const colors = view.palette || [];
    $("p-palette").replaceChildren(...colors.map((c) => {
      const dot = el("span");
      dot.style.background = c.hex;
      dot.title = c.hex + " · " + Math.round(c.weight * 100) + "%";
      return dot;
    }));
    const tint = colors.find((c) => Math.hypot(c.lab[1], c.lab[2]) >= 15) || colors[0];
    $("player").style.background = tint
      ? "linear-gradient(135deg, color-mix(in srgb, " + tint.hex + " 28%, var(--surface)), var(--surface) 75%)"
      : "";
  }

  async function loadLyrics(id, tries = 0) {
    clearTimeout(lyricsTimer);
    const box = $("lyrics");
    if (tries === 0) {
      lyricLines = [];
      lyricIndex = -1;
      box.replaceChildren();
    }
    try {
      const r = await fetch("/api/tracks/" + id + "/lyrics");
      if (id !== current) return;
      if (r.status === 404) {
        box.replaceChildren(el("div", "empty", "Lyrics pending"));
        if (tries < 60) lyricsTimer = setTimeout(() => loadLyrics(id, tries + 1), 3000);
        return;
      }
      const v = await r.json();
      if (!r.ok) throw new Error(v.error || r.statusText);
      lyricOffset = v.offset_ms || 0;
      const source = el("div", "sub", "Source: " + (LYRICS_SOURCE[v.source] || "none"));
      if (v.status === "synced") {
        lyricLines = v.lines;
        lyricIndex = -1;
        box.replaceChildren(...v.lines.map((l) => {
          const line = el("div", "line", l.text || "♪");
          line.dir = "auto";
          line.addEventListener("click", () => { $("audio").currentTime = Math.max(0, (l.time_ms + lyricOffset) / 1000); });
          return line;
        }), source);
        syncLyrics();
      } else if (v.status === "plain") {
        const text = el("div", "plain", v.plain);
        text.dir = "auto";
        box.replaceChildren(text, source);
      } else {
        box.replaceChildren(el("div", "empty", v.status === "instrumental" ? "Instrumental" : "No lyrics"));
      }
    } catch (err) {
      box.replaceChildren(el("div", "empty", "Lyrics failed: " + err.message));
    }
  }

  function syncLyrics() {
    if (!lyricLines.length) return;
    const t = $("audio").currentTime * 1000 - lyricOffset;
    let i = -1;
    while (i + 1 < lyricLines.length && lyricLines[i + 1].time_ms <= t) i++;
    if (i === lyricIndex) return;
    const box = $("lyrics");
    const rows = box.querySelectorAll(".line");
    if (rows[lyricIndex]) rows[lyricIndex].classList.remove("now");
    lyricIndex = i;
    const row = rows[i];
    if (!row) return;
    row.classList.add("now");
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    box.scrollTo({ top: row.offsetTop - box.clientHeight / 2 + row.clientHeight / 2, behavior: smooth ? "smooth" : "auto" });
  }

  function render(view) {
    $("p-status").textContent = view.status;
    $("p-err").textContent = view.error ? "Error: " + view.error : "";
    const audio = $("audio");
    if (view.audio) {
      peaks = view.audio.waveform || [];
      $("p-loud").textContent = "Original loudness " + Number(view.audio.loudness_lufs).toFixed(1) + " LUFS";
      $("p-gain").textContent = "Gain " + Number(view.audio.gain_db).toFixed(1) + " dB";
      $("p-dur").textContent = fmt(view.audio.duration_ms);
      if (audio.dataset.src !== view.audio.url) {
        audio.dataset.src = view.audio.url;
        audio.src = view.audio.url;
        audio.play().catch(() => {});
      }
    } else {
      peaks = [];
      $("p-loud").textContent = $("p-gain").textContent = $("p-dur").textContent = "";
      audio.removeAttribute("src");
      delete audio.dataset.src;
    }
    draw();
  }

  function poll(id) {
    pollTimer = setTimeout(async () => {
      if (id !== current) return;
      try {
        const view = await api("/api/tracks/" + id);
        if (id !== current) return;
        render(view);
        if (view.status === "cached" || view.status === "failed") loadRecent();
        else poll(id);
      } catch {
        poll(id);
      }
    }, 1500);
  }

  function draw() {
    const canvas = $("wave");
    const ctx = canvas.getContext("2d");
    const css = getComputedStyle(document.documentElement);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!peaks.length) return;
    const audio = $("audio");
    const played = audio.duration ? audio.currentTime / audio.duration : 0;
    const bar = canvas.width / peaks.length;
    peaks.forEach((p, i) => {
      const h = Math.max(4, p * canvas.height);
      ctx.fillStyle = (i / peaks.length) < played ? css.getPropertyValue("--accent-strong") : css.getPropertyValue("--soft");
      ctx.fillRect(i * bar + 1, (canvas.height - h) / 2, Math.max(1, bar - 2), h);
    });
  }

  $("audio").addEventListener("timeupdate", draw);
  $("audio").addEventListener("timeupdate", syncLyrics);
  $("audio").addEventListener("seeked", syncLyrics);
  $("audio").addEventListener("seeked", draw);
  $("wave").addEventListener("click", (e) => {
    const audio = $("audio");
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  $("import-file").addEventListener("change", () => {
    const file = $("import-file").files[0];
    if (file && !$("import-name").value) $("import-name").value = file.name.replace(/\.csv$/i, "").replace(/_/g, " ").trim();
  });

  $("import-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const file = $("import-file").files[0];
    const out = $("import-result");
    out.textContent = "Importing";
    try {
      const qs = new URLSearchParams({ url: $("import-url").value, name: $("import-name").value });
      const sum = await api("/api/playlists/import?" + qs, {
        method: "POST",
        headers: { "Content-Type": "text/csv" },
        body: await file.text(),
      });
      out.textContent = [sum.tracks + " tracks", sum.added + " added", sum.queued + " queued", sum.skipped + " skipped"].join(" · ");
      await loadPlaylists();
      openPlaylist(sum.playlist_id);
    } catch (err) {
      out.textContent = "Import failed: " + err.message;
    }
  });

  function countChips(c) {
    const box = el("div", "chips");
    box.append(
      chip("Matched " + c.matched, "ok"),
      chip("Review " + c.review, c.review ? "warn" : ""),
      chip("Unmatched " + c.unmatched, c.unmatched ? "bad" : ""),
      chip("Pending " + c.pending),
      chip("Cached " + c.cached + "/" + c.total),
    );
    return box;
  }

  function progress(c) {
    const bar = el("div", "bar");
    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-label", "Cached");
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", String(c.total));
    bar.setAttribute("aria-valuenow", String(c.cached));
    const fill = el("span");
    fill.style.width = (c.total ? (100 * c.cached) / c.total : 0) + "%";
    bar.append(fill);
    return bar;
  }

  async function loadPlaylists() {
    try {
      const { playlists } = await api("/api/playlists");
      if (!playlists.length) return $("playlists").replaceChildren(el("div", "empty", "No playlists"));
      $("playlists").replaceChildren(...playlists.map((p) => {
        const r = el("div", "prow");
        const info = el("div");
        const t = el("div", "title", p.name); t.dir = "auto";
        info.append(t, countChips(p.counts), progress(p.counts));
        const b = el("button", "", "Open");
        b.type = "button";
        b.addEventListener("click", () => openPlaylist(p.id));
        r.append(info, b);
        return r;
      }));
    } catch (err) {
      $("playlists").replaceChildren(el("div", "empty", "Couldn't load playlists: " + err.message));
    }
  }

  async function openPlaylist(id) {
    openPlaylistId = id;
    $("playlist").hidden = false;
    await refreshPlaylist();
  }

  async function refreshPlaylist() {
    const id = openPlaylistId;
    clearTimeout(playlistTimer);
    try {
      const p = await api("/api/playlists/" + id);
      if (id !== openPlaylistId) return;
      renderPlaylist(p);
      const c = p.counts;
      if (c.pending > 0 || c.cached < c.matched + c.review) {
        playlistTimer = setTimeout(() => { refreshPlaylist(); loadPlaylists(); }, 5000);
      }
    } catch (err) {
      $("pl-tracks").replaceChildren(el("div", "empty", "Couldn't load playlist: " + err.message));
    }
  }

  function renderPlaylist(p) {
    lastPlaylist = p;
    $("pl-title").textContent = p.name;
    $("pl-counts").replaceChildren(countChips(p.counts), progress(p.counts));
    const tracks = p.tracks.filter((t) => playlistFilter === "all" || t.match_status === playlistFilter);
    if (!tracks.length) return $("pl-tracks").replaceChildren(el("div", "empty", "No tracks"));
    $("pl-tracks").replaceChildren(...tracks.map((t) => row({
      artwork: t.artwork_thumb_url || t.artwork_url,
      title: t.title,
      subtitle: t.artists.join(", ") + (t.album ? " · " + t.album : ""),
      detail: t.source && (t.match_status === "review" || t.match_status === "unmatched") ? sourceLink(t.source) : null,
      duration: t.duration_ms,
      chips: [matchChip(t), cacheChip(t)],
      action: "Play",
      onAction: () => play(t.id),
    })));
  }

  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    playlistFilter = b.dataset.filter;
    document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    if (lastPlaylist) renderPlaylist(lastPlaylist);
  }));

  async function loadRecent() {
    try {
      const { tracks } = await api("/api/tracks?limit=20");
      if (!tracks.length) return $("recent").replaceChildren(el("div", "empty", "No tracks yet"));
      $("recent").replaceChildren(...tracks.map((t) => row({
        artwork: t.artwork_thumb_url || t.artwork_url,
        title: t.title,
        subtitle: t.artists.join(", ") + (t.album ? " · " + t.album : ""),
        duration: t.duration_ms,
        chips: [cacheChip(t)],
        action: "Play",
        onAction: () => play(t.id),
      })));
    } catch (err) {
      $("recent").replaceChildren(el("div", "empty", "Couldn't load tracks: " + err.message));
    }
  }

  loadRecent();
  loadPlaylists();
</script>
</body>
</html>
