<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobbos Dev Player</title>
<style>
  :root {
    --bg: #FFF7F0; --surface: #FFFFFF; --ink: #3B2F3F; --muted: #7A6A7E;
    --accent: #E88FA3; --accent-strong: #A8445E; --soft: #F7C6D0; --on-accent: #FFFFFF;
    --line: rgba(59, 47, 63, 0.14);
    --ok-bg: #D6F0DC; --ok-ink: #1F5A2E; --warn-bg: #FBE7B5; --warn-ink: #6B4A00; --bad-bg: #F9D0CC; --bad-ink: #7A1F16;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E1B3A; --surface: #262249; --ink: #F5EEF8; --muted: #B9AEC6;
      --accent: #F2A7B8; --accent-strong: #F2A7B8; --soft: #3A3160; --on-accent: #1E1B3A;
      --line: rgba(245, 238, 248, 0.14);
      --ok-bg: #234A31; --ok-ink: #C8F0D2; --warn-bg: #4F4019; --warn-ink: #FBE7B5; --bad-bg: #5A2A2A; --bad-ink: #F9D0CC;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  a { color: inherit; }
  .card { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06); min-width: 0; }
  form { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  input[type=search], input[type=url], input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  input[type=file] { font: inherit; max-width: 100%; }
  .field { display: grid; gap: 4px; flex: 1 1 240px; min-width: 0; font-size: 13px; color: var(--muted); }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 16px; background: var(--accent-strong); color: var(--on-accent); cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row:last-child, .prow:last-child { border-bottom: 0; }
  .row img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--soft); }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .title { font-weight: 700; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  a.sub { display: block; width: fit-content; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .chip.bad { background: var(--bad-bg); color: var(--bad-ink); }
  .prow .chips, #pl-counts .chips { justify-content: flex-start; margin: 4px 0 6px; }
  .field.submit { flex: 0 0 auto; align-self: flex-end; }
  .bar { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent-strong); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
  .tabs button { background: var(--soft); color: var(--ink); padding: 4px 12px; font-size: 13px; }
  .tabs button[aria-pressed=true] { background: var(--accent-strong); color: var(--on-accent); }
  .head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 12px; }
  .phead { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
  .phead .head { margin-bottom: 8px; }
  .art { width: 96px; height: 96px; flex: none; border-radius: 12px; object-fit: cover; background: var(--soft); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15); }
  .swatches { display: flex; gap: 6px; }
  .swatches span { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); }
  #player { transition: background 0.4s; }
  @media (prefers-reduced-motion: reduce) { #player { transition: none; } }
  canvas { width: 100%; height: 64px; display: block; cursor: pointer; margin-bottom: 8px; }
  audio { width: 100%; }
  .meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .empty { color: var(--muted); padding: 8px 0; }
  .versions { margin-top: 12px; }
  .versions summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .versions form { margin: 8px 0 0; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; font-size: 14px; margin-bottom: 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  h3 { font-size: 14px; margin: 16px 0 6px; }
  textarea { font: inherit; width: 100%; min-height: 60px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .lyrics { position: relative; max-height: 280px; overflow-y: auto; margin-top: 12px; padding: 8px 4px 0; border-top: 1px solid var(--line); }
  .lyrics .line { padding: 3px 0; color: var(--muted); cursor: pointer; font-size: 17px; line-height: 1.5; transition: color 0.2s; }
  .lyrics .line.now { color: var(--ink); font-weight: 700; }
  .lyrics .plain { white-space: pre-wrap; }
  .lyrics > .sub { padding: 8px 0; }
  @media (prefers-reduced-motion: reduce) { .lyrics .line { transition: none; } }
  @media (max-width: 560px) {
    .row { grid-template-columns: 48px minmax(0, 1fr) auto; }
    .row .dur { display: none; }
    .row .chips { grid-column: 2; grid-row: 2; justify-content: flex-start; }
    .row button { grid-column: 3; grid-row: 1 / span 2; }
  }
</style>
</head>
<body>
<main>
  <h1>Jobbos dev player</h1>

  <section class="card" aria-labelledby="search-h">
    <h2 id="search-h">Search</h2>
    <form id="search-form">
      <input id="q" type="search" aria-label="Search or link" placeholder="Song, artist or link" required>
      <button type="submit">Search</button>
    </form>
    <div id="results"></div>
  </section>

  <section class="card" id="player" hidden aria-labelledby="p-title">
    <div class="phead">
      <img class="art" id="p-art" alt="" hidden>
      <div>
        <div class="head">
          <span class="title" id="p-title" dir="auto"></span>
          <span class="sub" id="p-artist" dir="auto"></span>
          <span class="chip" id="p-status"></span>
        </div>
        <div class="swatches" id="p-palette" aria-hidden="true"></div>
      </div>
    </div>
    <canvas id="wave" width="1600" height="128" aria-label="Waveform"></canvas>
    <audio id="audio" controls preload="metadata"></audio>
    <div class="meta">
      <span id="p-loud"></span><span id="p-gain"></span><span id="p-dur"></span><span id="p-err"></span>
    </div>
    <details class="versions" id="edit">
      <summary>Edit</summary>
      <form id="e-form">
        <label class="field">Title <input id="e-title" type="text" required maxlength="500" dir="auto"></label>
        <label class="field">Artist <input id="e-artist" type="text" maxlength="400" dir="auto"></label>
        <label class="field">Note <input id="e-note" type="text" maxlength="2000" dir="auto"></label>
        <label class="field">Cover <input id="e-cover" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <div class="field submit"><button type="submit">Save</button></div>
      </form>
      <div class="sub" id="e-result" role="status"></div>
    </details>
    <details class="versions" id="versions">
      <summary>Versions</summary>
      <div id="v-list"></div>
      <form id="v-form">
        <input id="v-url" type="url" required placeholder="https://www.youtube.com/watch?v=…" aria-label="Recording link">
        <button type="submit">Use link</button>
      </form>
    </details>
    <div class="lyrics" id="lyrics" aria-label="Lyrics"></div>
  </section>

  <section class="card" aria-labelledby="import-h">
    <h2 id="import-h">Import</h2>
    <form id="import-form">
      <label class="field">Spotify playlist link
        <input id="import-url" type="url" required placeholder="https://open.spotify.com/playlist/…">
      </label>
      <label class="field">Name
        <input id="import-name" type="text" required maxlength="200" dir="auto">
      </label>
      <label class="field">Exportify CSV
        <input id="import-file" type="file" accept=".csv,text/csv" required>
      </label>
      <div class="field submit"><button type="submit">Import</button></div>
    </form>
    <div class="sub" id="import-result" role="status"></div>
  </section>

  <section class="card" aria-labelledby="upload-h">
    <h2 id="upload-h">Upload</h2>
    <form id="u-form">
      <label class="field">Audio file <input id="u-file" type="file" required accept=".mp3,.m4a,.wav,.flac,.ogg,.opus"></label>
      <label class="field">Title <input id="u-title" type="text" maxlength="500" dir="auto"></label>
      <label class="field">Artist <input id="u-artist" type="text" maxlength="400" dir="auto"></label>
      <label class="field">Note <input id="u-note" type="text" maxlength="2000" dir="auto"></label>
      <label class="field">Cover <input id="u-cover" type="file" accept="image/jpeg,image/png,image/webp"></label>
      <div class="field submit"><button type="submit">Upload</button></div>
    </form>
    <div class="sub" id="u-result" role="status"></div>
  </section>

  <section class="card" aria-labelledby="playlists-h">
    <h2 id="playlists-h">Playlists</h2>
    <div id="playlists"></div>
  </section>

  <section class="card" id="playlist" hidden aria-labelledby="pl-title">
    <h2 id="pl-title" dir="auto"></h2>
    <div id="pl-counts"></div>
    <div class="tabs" role="group" aria-label="Filter">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="review" aria-pressed="false">Review</button>
      <button type="button" data-filter="unmatched" aria-pressed="false">Unmatched</button>
      <button type="button" data-filter="pending" aria-pressed="false">Pending</button>
    </div>
    <div id="pl-tracks"></div>
  </section>

  <section class="card" aria-labelledby="status-h">
    <div class="head"><h2 id="status-h">Source status</h2><button type="button" id="st-refresh">Refresh</button></div>
    <div id="status"></div>
  </section>

  <section class="card" aria-labelledby="recent-h">
    <h2 id="recent-h">Recent tracks</h2>
    <div id="recent"></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (ms) => {
    if (!ms) return "";
    const s = Math.round(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  let current = null;
  let peaks = [];
  let pollTimer = null;
  let openPlaylistId = null;
  let playlistFilter = "all";
  let playlistTimer = null;
  let lastPlaylist = null;
  let lyricLines = [];
  let lyricOffset = 0;
  let lyricIndex = -1;
  let lyricsTimer = null;
  const PROVIDER = { ytmusic: "YT Music", youtube: "YouTube", soundcloud: "SoundCloud", other: "Link" };
  const LYRICS_SOURCE = { lrclib: "LRCLIB", ytmusic: "YouTube Music", manual: "Manual" };

  async function api(path, opts) {
    const r = await fetch(path, opts);
    const text = await r.text();
    const body = text ? JSON.parse(text) : null;
    if (!r.ok && r.status !== 202) throw new Error((body && body.error) || r.statusText);
    return body;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function chip(text, kind) {
    return el("span", kind ? "chip " + kind : "chip", text);
  }

  const MATCH_KIND = { matched: "ok", chosen: "ok", review: "warn", unmatched: "bad", pending: "" };

  function matchChip(t) {
    if (!t.match_status) return null;
    const score = t.match_status === "review" && t.source && t.source.score != null ? " " + t.source.score.toFixed(2) : "";
    return chip(t.match_status + score, MATCH_KIND[t.match_status]);
  }

  function cacheChip(t) {
    return chip(t.status, t.status === "cached" ? "ok" : t.status === "failed" ? "bad" : "");
  }

  function sourceLink(source) {
    const host = source.provider === "ytmusic" ? "https://music.youtube.com" : "https://www.youtube.com";
    const parts = [source.title, source.uploader, fmt(source.duration_ms)].filter(Boolean);
    const a = el("a", "sub", "Source: " + parts.join(" · "));
    a.href = /^https?:\/\//.test(source.external_id) ? source.external_id : host + "/watch?v=" + encodeURIComponent(source.external_id);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.dir = "auto";
    return a;
  }

  function row({ artwork, title, subtitle, detail, duration, chips = [], action, onAction }) {
    const r = el("div", "row");
    const img = el("img");
    img.alt = "";
    img.loading = "lazy";
    if (artwork) img.src = artwork;
    const info = el("div");
    const t = el("div", "title", title); t.dir = "auto";
    const s = el("div", "sub", subtitle); s.dir = "auto";
    info.append(t, s);
    if (detail) info.append(detail);
    const c = el("div", "chips");
    c.append(...chips.filter(Boolean));
    const b = el("button", "", action);
    b.type = "button";
    b.addEventListener("click", onAction);
    r.append(img, info, el("span", "sub dur", fmt(duration)), c, b);
    return r;
  }

  $("search-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    const list = $("results");
    if (/^https?:\/\//i.test(q)) return importLink(q, list);
    list.replaceChildren(el("div", "empty", "Searching"));
    const base = "/api/search?limit=20&q=" + encodeURIComponent(q);
    const more = api(base + "&sources=soundcloud").catch(() => ({ results: [] }));
    try {
      const { results } = await api(base + "&sources=ytmusic,youtube");
      showResults(list, results);
      const extra = (await more).results.filter((r) => !results.some((x) => x.external_id === r.external_id));
      if (q === $("q").value.trim() && extra.length) showResults(list, results.concat(extra));
    } catch (err) {
      list.replaceChildren(el("div", "empty", "Search failed: " + err.message));
    }
  });

  function showResults(list, results) {
    if (!results.length) return list.replaceChildren(el("div", "empty", "No results"));
    list.replaceChildren(...results.map((r) => row({
      artwork: r.thumbnail,
      title: r.title,
      subtitle: r.artists.map((a) => a.name).join(", ") + (r.album ? " · " + r.album.name : ""),
      duration: r.duration_ms,
      chips: [chip(PROVIDER[r.provider] || r.provider)],
      action: "Play",
      onAction: () => addAndPlay(r),
    })));
  }

  async function importLink(url, list) {
    list.replaceChildren(el("div", "empty", "Opening link"));
    try {
      const res = await api("/api/links", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      if (res.track) {
        list.replaceChildren(el("div", "empty", "Link: " + res.track.title));
        show(res.track);
        loadRecent();
      } else if (res.playlist) {
        const p = res.playlist;
        const parts = [p.tracks + " tracks", p.added + " added", p.queued + " queued"];
        if (res.truncated) parts.push("first 100 tracks");
        list.replaceChildren(el("div", "empty", "Imported: " + parts.join(" · ")));
        await loadPlaylists();
        openPlaylist(p.playlist_id);
      }
    } catch (err) {
      list.replaceChildren(el("div", "empty", err.message));
    }
  }

  async function addAndPlay(result) {
    try {
      show(await api("/api/tracks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(result),
      }));
      loadRecent();
    } catch (err) {
      $("player").hidden = false;
      $("p-err").textContent = "Error: " + err.message;
    }
  }

  async function play(id) {
    try {
      show(await api("/api/tracks/" + id + "/cache", { method: "POST" }));
    } catch (err) {
      $("player").hidden = false;
      $("p-err").textContent = "Error: " + err.message;
    }
  }

  function show(view) {
    current = view.id;
    $("player").hidden = false;
    $("p-title").textContent = view.title;
    $("p-artist").textContent = view.artists.join(", ");
    showArtwork(view);
    fillEdit(view);
    $("versions").open = false;
    $("v-list").replaceChildren();
    clearTimeout(pollTimer);
    render(view);
    if (view.status !== "cached" && view.status !== "failed") poll(view.id);
    loadLyrics(view.id);
  }

  function showArtwork(view) {
    const art = $("p-art");
    art.hidden = !view.artwork_url;
    if (view.artwork_url) art.src = view.artwork_url;
    const colors = view.palette || [];
    $("p-palette").replaceChildren(...colors.map((c) => {
      const dot = el("span");
      dot.style.background = c.hex;
      dot.title = c.hex + " · " + Math.round(c.weight * 100) + "%";
      return dot;
    }));
    const tint = colors.find((c) => Math.hypot(c.lab[1], c.lab[2]) >= 15) || colors[0];
    $("player").style.background = tint
      ? "linear-gradient(135deg, color-mix(in srgb, " + tint.hex + " 28%, var(--surface)), var(--surface) 75%)"
      : "";
  }

  async function loadVersions() {
    const id = current;
    const list = $("v-list");
    list.replaceChildren(el("div", "empty", "Loading"));
    try {
      const { sources } = await api("/api/tracks/" + id + "/sources");
      if (id !== current) return;
      if (!sources.length) return list.replaceChildren(el("div", "empty", "No versions"));
      list.replaceChildren(...sources.map((v) => {
        const r = el("div", "row");
        const info = el("div");
        const title = sourceLink(v);
        title.className = "title";
        title.textContent = v.title || v.external_id;
        const meta = [v.uploader, fmt(v.duration_ms), v.score != null ? "score " + v.score.toFixed(2) : ""].filter(Boolean).join(" · ");
        const sub = el("div", "sub", meta);
        sub.dir = "auto";
        info.append(title, sub);
        const chips = el("div", "chips");
        chips.append(chip(PROVIDER[v.provider] || v.provider));
        let action;
        if (v.status === "selected") {
          action = chip("selected", "ok");
        } else {
          action = el("button", "", "Use");
          action.type = "button";
          action.addEventListener("click", () => chooseVersion({
            provider: v.provider, external_id: v.external_id, title: v.title || v.external_id,
            artists: v.uploader ? [{ name: v.uploader }] : [], duration_ms: v.duration_ms,
          }));
        }
        r.append(el("span"), info, el("span", "sub dur", ""), chips, action);
        return r;
      }));
    } catch (err) {
      list.replaceChildren(el("div", "empty", "Versions failed: " + err.message));
    }
  }

  async function chooseVersion(body) {
    try {
      const view = await api("/api/tracks/" + current + "/source", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const audio = $("audio");
      audio.pause();
      delete audio.dataset.src;
      delete audio.dataset.stream;
      show(view);
      $("versions").open = true;
      loadVersions();
    } catch (err) {
      $("v-list").prepend(el("div", "empty", "Error: " + err.message));
    }
  }

  $("versions").addEventListener("toggle", () => { if ($("versions").open) loadVersions(); });
  $("v-form").addEventListener("submit", (e) => {
    e.preventDefault();
    chooseVersion({ url: $("v-url").value.trim() });
    $("v-url").value = "";
  });

  async function loadLyrics(id, tries = 0) {
    clearTimeout(lyricsTimer);
    const box = $("lyrics");
    if (tries === 0) {
      lyricLines = [];
      lyricIndex = -1;
      box.replaceChildren();
    }
    try {
      const r = await fetch("/api/tracks/" + id + "/lyrics");
      if (id !== current) return;
      if (r.status === 404) {
        box.replaceChildren(el("div", "empty", "Lyrics pending"));
        if (tries < 60) lyricsTimer = setTimeout(() => loadLyrics(id, tries + 1), 3000);
        return;
      }
      const v = await r.json();
      if (!r.ok) throw new Error(v.error || r.statusText);
      lyricOffset = v.offset_ms || 0;
      const source = el("div", "sub", "Source: " + (LYRICS_SOURCE[v.source] || "none"));
      if (v.status === "synced") {
        lyricLines = v.lines;
        lyricIndex = -1;
        box.replaceChildren(...v.lines.map((l) => {
          const line = el("div", "line", l.text || "♪");
          line.dir = "auto";
          line.addEventListener("click", () => { $("audio").currentTime = Math.max(0, (l.time_ms + lyricOffset) / 1000); });
          return line;
        }), source);
        syncLyrics();
      } else if (v.status === "plain") {
        const text = el("div", "plain", v.plain);
        text.dir = "auto";
        box.replaceChildren(text, source);
      } else {
        box.replaceChildren(el("div", "empty", v.status === "instrumental" ? "Instrumental" : "No lyrics"));
      }
    } catch (err) {
      box.replaceChildren(el("div", "empty", "Lyrics failed: " + err.message));
    }
  }

  function syncLyrics() {
    if (!lyricLines.length) return;
    const t = $("audio").currentTime * 1000 - lyricOffset;
    let i = -1;
    while (i + 1 < lyricLines.length && lyricLines[i + 1].time_ms <= t) i++;
    if (i === lyricIndex) return;
    const box = $("lyrics");
    const rows = box.querySelectorAll(".line");
    if (rows[lyricIndex]) rows[lyricIndex].classList.remove("now");
    lyricIndex = i;
    const row = rows[i];
    if (!row) return;
    row.classList.add("now");
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    box.scrollTo({ top: row.offsetTop - box.clientHeight / 2 + row.clientHeight / 2, behavior: smooth ? "smooth" : "auto" });
  }

  function render(view) {
    const audio = $("audio");
    const streaming = audio.dataset.stream === view.id && !audio.paused && !audio.ended;
    $("p-status").textContent = streaming ? "streaming" : view.status;
    $("p-err").textContent = view.error ? "Error: " + view.error : "";
    if (view.audio) {
      peaks = view.audio.waveform || [];
      $("p-loud").textContent = "Original loudness " + Number(view.audio.loudness_lufs).toFixed(1) + " LUFS";
      $("p-gain").textContent = "Gain " + Number(view.audio.gain_db).toFixed(1) + " dB";
      $("p-dur").textContent = fmt(view.audio.duration_ms);
      if (!streaming && audio.dataset.src !== view.audio.url) {
        audio.dataset.src = view.audio.url;
        delete audio.dataset.stream;
        audio.src = view.audio.url;
        audio.play().catch(() => {});
      }
    } else if (view.stream_url) {
      peaks = [];
      $("p-loud").textContent = $("p-gain").textContent = $("p-dur").textContent = "";
      $("p-status").textContent = "streaming";
      if (audio.dataset.src !== view.stream_url) {
        audio.dataset.src = view.stream_url;
        audio.dataset.stream = view.id;
        audio.src = view.stream_url;
        audio.play().catch(() => {});
      }
    } else {
      peaks = [];
      $("p-loud").textContent = $("p-gain").textContent = $("p-dur").textContent = "";
      audio.removeAttribute("src");
      delete audio.dataset.src;
      delete audio.dataset.stream;
    }
    draw();
  }

  function poll(id) {
    pollTimer = setTimeout(async () => {
      if (id !== current) return;
      try {
        const view = await api("/api/tracks/" + id);
        if (id !== current) return;
        render(view);
        if (view.status === "cached" || view.status === "failed") loadRecent();
        else poll(id);
      } catch {
        poll(id);
      }
    }, 1500);
  }

  function draw() {
    const canvas = $("wave");
    const ctx = canvas.getContext("2d");
    const css = getComputedStyle(document.documentElement);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!peaks.length) return;
    const audio = $("audio");
    const played = audio.duration ? audio.currentTime / audio.duration : 0;
    const bar = canvas.width / peaks.length;
    peaks.forEach((p, i) => {
      const h = Math.max(4, p * canvas.height);
      ctx.fillStyle = (i / peaks.length) < played ? css.getPropertyValue("--accent-strong") : css.getPropertyValue("--soft");
      ctx.fillRect(i * bar + 1, (canvas.height - h) / 2, Math.max(1, bar - 2), h);
    });
  }

  $("audio").addEventListener("timeupdate", draw);
  $("audio").addEventListener("timeupdate", syncLyrics);
  $("audio").addEventListener("seeked", syncLyrics);
  $("audio").addEventListener("seeked", draw);
  $("wave").addEventListener("click", (e) => {
    const audio = $("audio");
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  $("import-file").addEventListener("change", () => {
    const file = $("import-file").files[0];
    if (file && !$("import-name").value) $("import-name").value = file.name.replace(/\.csv$/i, "").replace(/_/g, " ").trim();
  });

  $("import-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const file = $("import-file").files[0];
    const out = $("import-result");
    out.textContent = "Importing";
    try {
      const qs = new URLSearchParams({ url: $("import-url").value, name: $("import-name").value });
      const sum = await api("/api/playlists/import?" + qs, {
        method: "POST",
        headers: { "Content-Type": "text/csv" },
        body: await file.text(),
      });
      out.textContent = [sum.tracks + " tracks", sum.added + " added", sum.queued + " queued", sum.skipped + " skipped"].join(" · ");
      await loadPlaylists();
      openPlaylist(sum.playlist_id);
    } catch (err) {
      out.textContent = "Import failed: " + err.message;
    }
  });

  function countChips(c) {
    const box = el("div", "chips");
    box.append(
      chip("Matched " + c.matched, "ok"),
      chip("Review " + c.review, c.review ? "warn" : ""),
      chip("Unmatched " + c.unmatched, c.unmatched ? "bad" : ""),
      chip("Pending " + c.pending),
      chip("Cached " + c.cached + "/" + c.total),
    );
    return box;
  }

  function progress(c) {
    const bar = el("div", "bar");
    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-label", "Cached");
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", String(c.total));
    bar.setAttribute("aria-valuenow", String(c.cached));
    const fill = el("span");
    fill.style.width = (c.total ? (100 * c.cached) / c.total : 0) + "%";
    bar.append(fill);
    return bar;
  }

  async function loadPlaylists() {
    try {
      const { playlists } = await api("/api/playlists");
      if (!playlists.length) return $("playlists").replaceChildren(el("div", "empty", "No playlists"));
      $("playlists").replaceChildren(...playlists.map((p) => {
        const r = el("div", "prow");
        const info = el("div");
        const t = el("div", "title", p.name); t.dir = "auto";
        info.append(t, countChips(p.counts), progress(p.counts));
        if (p.source_provider === "youtube") {
          const label = el("label", "sub");
          const box = el("input");
          box.type = "checkbox";
          box.checked = p.sync_enabled;
          box.addEventListener("change", () => api("/api/playlists/" + p.id, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sync_enabled: box.checked }),
          }).catch(() => { box.checked = !box.checked; }));
          label.append(box, " Sync every 6 hours");
          info.append(label);
        }
        const b = el("button", "", "Open");
        b.type = "button";
        b.addEventListener("click", () => openPlaylist(p.id));
        r.append(info, b);
        return r;
      }));
    } catch (err) {
      $("playlists").replaceChildren(el("div", "empty", "Couldn't load playlists: " + err.message));
    }
  }

  async function openPlaylist(id) {
    openPlaylistId = id;
    $("playlist").hidden = false;
    await refreshPlaylist();
  }

  async function refreshPlaylist() {
    const id = openPlaylistId;
    clearTimeout(playlistTimer);
    try {
      const p = await api("/api/playlists/" + id);
      if (id !== openPlaylistId) return;
      renderPlaylist(p);
      const c = p.counts;
      if (c.pending > 0 || c.cached < c.matched + c.review) {
        playlistTimer = setTimeout(() => { refreshPlaylist(); loadPlaylists(); }, 5000);
      }
    } catch (err) {
      $("pl-tracks").replaceChildren(el("div", "empty", "Couldn't load playlist: " + err.message));
    }
  }

  function renderPlaylist(p) {
    lastPlaylist = p;
    $("pl-title").textContent = p.name;
    $("pl-counts").replaceChildren(countChips(p.counts), progress(p.counts));
    const tracks = p.tracks.filter((t) => playlistFilter === "all" || t.match_status === playlistFilter);
    if (!tracks.length) return $("pl-tracks").replaceChildren(el("div", "empty", "No tracks"));
    $("pl-tracks").replaceChildren(...tracks.map((t, i) => row({
      artwork: t.artwork_thumb_url || t.artwork_url,
      title: t.title,
      subtitle: t.artists.join(", ") + (t.album ? " · " + t.album : ""),
      detail: t.source && (t.match_status === "review" || t.match_status === "unmatched") ? sourceLink(t.source) : null,
      duration: t.duration_ms,
      chips: [matchChip(t), cacheChip(t)],
      action: "Play",
      onAction: () => { play(t.id); prefetchNext(tracks, i); },
    })));
  }

  function prefetchNext(list, i) {
    const ids = list.slice(i + 1, i + 3).map((t) => t.id);
    if (!ids.length) return;
    api("/api/prefetch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ track_ids: ids }),
    }).catch(() => {});
  }

  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    playlistFilter = b.dataset.filter;
    document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    if (lastPlaylist) renderPlaylist(lastPlaylist);
  }));

  async function loadRecent() {
    try {
      const { tracks } = await api("/api/tracks?limit=20");
      if (!tracks.length) return $("recent").replaceChildren(el("div", "empty", "No tracks yet"));
      $("recent").replaceChildren(...tracks.map((t) => row({
        artwork: t.artwork_thumb_url || t.artwork_url,
        title: t.title,
        subtitle: t.artists.join(", ") + (t.album ? " · " + t.album : ""),
        duration: t.duration_ms,
        chips: [cacheChip(t)],
        action: "Play",
        onAction: () => play(t.id),
      })));
    } catch (err) {
      $("recent").replaceChildren(el("div", "empty", "Couldn't load tracks: " + err.message));
    }
  }

  $("u-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const out = $("u-result");
    const form = new FormData();
    form.append("file", $("u-file").files[0]);
    for (const [key, id] of [["title", "u-title"], ["artist", "u-artist"], ["note", "u-note"]]) {
      if ($(id).value.trim()) form.append(key, $(id).value.trim());
    }
    if ($("u-cover").files[0]) form.append("cover", $("u-cover").files[0]);
    out.textContent = "Uploading";
    try {
      const res = await api("/api/uploads", { method: "POST", body: form });
      out.textContent = "Uploaded: " + res.track.title;
      $("u-form").reset();
      show(res.track);
      loadRecent();
    } catch (err) {
      out.textContent = "Upload failed: " + err.message;
    }
  });

  function fillEdit(view) {
    $("e-title").value = view.title || "";
    $("e-artist").value = (view.artists || []).join(", ");
    $("e-note").value = view.note || "";
    $("e-cover").value = "";
    $("e-result").textContent = "";
    $("edit").open = false;
  }

  $("e-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = current;
    const out = $("e-result");
    try {
      const res = await api("/api/tracks/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: $("e-title").value.trim(),
          artists: $("e-artist").value.split(",").map((a) => a.trim()).filter(Boolean),
          note: $("e-note").value.trim(),
        }),
      });
      const cover = $("e-cover").files[0];
      if (cover) {
        const form = new FormData();
        form.append("cover", cover);
        await api("/api/tracks/" + id + "/cover", { method: "POST", body: form });
      }
      $("p-title").textContent = res.track.title;
      $("p-artist").textContent = res.track.artists.join(", ");
      out.textContent = cover ? "Saved · cover processing" : "Saved";
      loadRecent();
    } catch (err) {
      out.textContent = "Save failed: " + err.message;
    }
  });

  const fmtBytes = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.round(n / 1e3) + " KB";
  const ago = (t) => {
    if (!t) return "never";
    const s = (Date.now() - new Date(t).getTime()) / 1000;
    if (s < 90) return Math.max(0, Math.round(s)) + " s ago";
    if (s < 5400) return Math.round(s / 60) + " min ago";
    if (s < 129600) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " d ago";
  };
  const SOURCE = {
    ytmusic: "Downloads: YouTube Music", youtube: "Downloads: YouTube", soundcloud: "Downloads: SoundCloud",
    other: "Downloads: other sites", search: "Matching: YouTube Music search", lyrics: "Lyrics: LRCLIB, YouTube Music",
    deezer: "Artwork: Deezer",
  };

  function kv(pairs) {
    const dl = el("dl", "kv");
    for (const [k, v] of pairs) dl.append(el("dt", "", k), el("dd", "", v));
    return dl;
  }

  async function loadStatus() {
    const box = $("status");
    try {
      const st = await api("/api/admin/status");
      const m = st.media || {};
      const yt = m.yt_dlp || {};
      const cookies = m.cookies;
      const tools = kv([
        ["yt-dlp", (yt.version || "unknown") + (yt.released ? " (" + yt.released + ")" : "") + (yt.update_available ? " · update available: " + yt.latest : "")],
        ["ytmusicapi", (m.ytmusicapi || {}).version || "unknown"],
        ["YouTube cookies", !cookies ? "unknown" : !cookies.configured ? "not configured" : !cookies.exists ? "file missing"
          : cookies.youtube_cookies + " cookies, updated " + ago(cookies.updated_at * 1000)],
        ["PO token provider", (m.po_token_provider || {}).version || "not installed"],
      ]);
      const workers = Object.entries(st.workers || {});
      const workerList = kv(workers.length ? workers.map(([id, w]) => [id, "last claim " + ago(w.last_claim_at)
        + (w.downloads_paused_until && new Date(w.downloads_paused_until) > Date.now()
          ? " · downloads paused until " + new Date(w.downloads_paused_until).toLocaleTimeString() : "")])
        : [["None", "no claims yet"]]);
      const sources = kv(st.store.sources.map((h) => [SOURCE[h.source] || h.source, "last success " + ago(h.last_ok_at)
        + (h.last_error_at && (!h.last_ok_at || new Date(h.last_error_at) > new Date(h.last_ok_at))
          ? " · last error " + ago(h.last_error_at) + ": " + (h.last_error || "").slice(0, 160) : "")]));
      const byKind = {};
      for (const c of st.store.jobs) (byKind[c.kind] = byKind[c.kind] || {})[c.status] = c.count;
      const jobs = kv(Object.entries(byKind).map(([kind, c]) => [kind, ["queued", "running", "failed", "done"]
        .filter((x) => c[x]).map((x) => c[x] + " " + x + (x === "done" ? " (24 h)" : "")).join(" · ")]));
      const failed = el("div");
      if (!st.store.failed.length) failed.append(el("div", "empty", "No failed jobs"));
      for (const j of st.store.failed) {
        const r = el("div", "row");
        const info = el("div");
        info.append(el("div", "title", (j.title || "Job " + j.id) + " · " + j.kind), el("div", "sub", (j.last_error || "").slice(0, 200)));
        const b = el("button", "", "Retry");
        b.type = "button";
        b.addEventListener("click", async () => { await api("/api/admin/jobs/" + j.id + "/retry", { method: "POST" }); loadStatus(); });
        r.append(el("span"), info, el("span"), el("span"), b);
        failed.append(r);
      }
      const c = st.store.cache;
      const cache = kv([
        ["Audio", c.audio_files + " files · " + fmtBytes(c.audio_bytes)],
        ["Pinned", c.pinned_files + " files · " + fmtBytes(c.pinned_bytes)],
        ["Clearable", c.clearable_files + " files · " + fmtBytes(c.clearable_bytes)],
        ["Images", c.image_files + " files · " + fmtBytes(c.image_bytes)],
      ]);
      const clear = el("button", "", "Clear unpinned");
      clear.type = "button";
      clear.disabled = !c.clearable_files;
      clear.addEventListener("click", async () => {
        if (clear.dataset.armed !== "1") {
          clear.dataset.armed = "1";
          clear.textContent = "Confirm clear";
          setTimeout(() => { clear.dataset.armed = ""; clear.textContent = "Clear unpinned"; }, 5000);
          return;
        }
        const res = await api("/api/admin/cache/clear", { method: "POST" });
        clear.textContent = "Cleared " + res.files + " files · " + fmtBytes(res.bytes);
        setTimeout(loadStatus, 1500);
      });
      const loud = el("div");
      loud.append(el("div", "sub", st.store.loud_files.length + " files above −1 dBTP · " + st.store.unmeasured_files + " files not measured"));
      for (const l of st.store.loud_files.slice(0, 10)) loud.append(el("div", "sub", l.title + " · " + l.true_peak_db.toFixed(1) + " dBTP"));
      box.replaceChildren(el("h3", "", "Tools"), tools, el("h3", "", "Workers"), workerList, el("h3", "", "Sources"), sources,
        el("h3", "", "Jobs"), jobs, el("h3", "", "Failed jobs"), failed, el("h3", "", "Cache"), cache, clear,
        el("h3", "", "Loud files"), loud);
    } catch (err) {
      box.replaceChildren(el("div", "empty", "Status failed: " + err.message));
    }
  }

  $("st-refresh").addEventListener("click", loadStatus);

  loadRecent();
  loadPlaylists();
  loadStatus();
</script>
</body>
</html>
